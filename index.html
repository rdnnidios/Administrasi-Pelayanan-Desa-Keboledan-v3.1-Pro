    <script>
        const USERS = {};

        const MENU_ITEMS = [
            { id: 'beranda', icon: 'fa-home', title: 'Beranda' },
            { id: 'pelayanan_surat', icon: 'fa-envelope-open-text', title: 'Pelayanan Surat' },
            { id: 'arsip_surat', icon: 'fa-envelope', title: 'Arsip Surat' },
            { id: 'penduduk', icon: 'fa-users', title: 'Data Penduduk' },
            { id: 'pbb', icon: 'fa-file-invoice-dollar', title: 'Data PBB' },
            { id: 'dtks', icon: 'fa-hands-helping', title: 'Data DTKS' },
            { id: 'administrasi_pertanahan', icon: 'fa-map-marked-alt', title: 'Administrasi Pertanahan' },
            { id: 'arsip_tanah', icon: 'fa-box-archive', title: 'Arsip Tanah' },
            { id: 'pembangunan', icon: 'fa-hard-hat', title: 'Ruang Pembangunan' },
            { id: 'pemberdayaan', icon: 'fa-seedling', title: 'Ruang Pemberdayaan' },
            { id: 'pembinaan', icon: 'fa-chalkboard-teacher', title: 'Ruang Pembinaan' },
            { id: 'ruang_kerja', icon: 'fa-briefcase', title: 'Ruang Kerja Umum' }
        ];

        const JENIS_SURAT = [
            { id: 'domisili', name: 'Surat Keterangan Domisili', kop: true },
            { id: 'skck', name: 'Surat Keterangan SKCK', kop: true },
            { id: 'sktm', name: 'Surat Keterangan Tidak Mampu', kop: true },
            { id: 'ijin_ortu', name: 'Surat Keterangan Ijin Orang Tua', kop: true },
            { id: 'hasil_ortu', name: 'Surat Keterangan Penghasilan Orang Tua', kop: true },
            { id: 'beda_id', name: 'Surat Keterangan Beda Identitas', kop: true },
            { id: 'jalan', name: 'Surat Keterangan Jalan', kop: true },
            { id: 'usaha', name: 'Surat Keterangan Usaha', kop: true },
            { id: 'usaha_tani', name: 'Surat Keterangan Usaha Pertanian', kop: true },
            { id: 'belum_nikah', name: 'Surat Keterangan Belum Menikah', kop: true },
            { id: 'ijin_ramai', name: 'Surat Keterangan Ijin Keramaian', kop: true },
            { id: 'kelahiran', name: 'Surat Keterangan Kelahiran', kop: false },
            { id: 'kematian', name: 'Surat Keterangan Kematian', kop: false },
            { id: 'ijin_listrik', name: 'Surat Pengantar Ijin Pemasangan Listrik', kop: true },
            { id: 'ijin_bangun', name: 'Surat Keterangan Ijin Bangunan', kop: true },
            { id: 'umum', name: 'Surat Keterangan Umum', kop: true },
            { id: 'kuasa', name: 'Surat Kuasa', kop: false },
            { id: 'kuasa_umum', name: 'Surat Kuasa Umum', kop: false },
            { id: 'pengantar', name: 'Surat Pengantar', kop: true },
            { id: 'jual_beli', name: 'Surat Perjanjian Jual Beli', kop: false },
            { id: 'hutang', name: 'Surat Keterangan Hutang Piutang', kop: false },
            { id: 'ijin_pasangan', name: 'Surat Ijin Suami/Istri', kop: true },
            { id: 'custom1', name: 'Surat Keterangan', kop: true }
        ];

        let APP_STATE = { currentUser: null, currentPage: 'beranda', db: loadDBLocal() };
        let quillEditor = null;
        let currentWorkspaceEditIndex = -1;

        // --- GLOBAL HELPER FUNCTIONS ---
        function closePrintPreview() {
            document.getElementById('print-preview-modal').classList.add('hidden');
        }

        // Export functionality for HTML elements to Word/PDF (Using existing functions based on HTML structure logic)
        function exportWordFromHTML(elementId, filename) {
            const preHtml = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML To Doc</title></head><body>";
            const postHtml = "</body></html>";
            const html = preHtml + document.getElementById(elementId).innerHTML + postHtml;
            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            const url = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(html);
            filename = filename ? filename + '.doc' : 'document.doc';
            const downloadLink = document.createElement("a");
            document.body.appendChild(downloadLink);
            if (navigator.msSaveOrOpenBlob) { navigator.msSaveOrOpenBlob(blob, filename); } else { downloadLink.href = url; downloadLink.download = filename; downloadLink.click(); }
            document.body.removeChild(downloadLink);
        }

        function exportPDFFromHTML(elementId, filename) {
            const element = document.getElementById(elementId);
            html2pdf().set({
                margin: 0.3, filename: filename + '.pdf', image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            }).from(element).save();
        }

        function downloadAsWord(htmlContent, filename) {
            const preHtml = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'></head><body>";
            const postHtml = "</body></html>";
            const html = preHtml + htmlContent + postHtml;
            const url = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(html);
            const downloadLink = document.createElement("a");
            document.body.appendChild(downloadLink);
            downloadLink.href = url; downloadLink.download = filename + '.doc'; downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        function loadDBLocal() {
            const def = {
                penduduk: [], pbb: [], dtks: [], administrasi_pertanahan: [], arsip_tanah: [], arsip_surat: [], log: [],
                docs_pembangunan: [], docs_pemberdayaan: [], docs_pembinaan: [], docs_ruang_kerja: []
            };
            return JSON.parse(localStorage.getItem('desa_keboledan_v3_1_db')) || def;
        }

        function saveDB(targetKey = null) { 
            localStorage.setItem('desa_keboledan_v3_1_db', JSON.stringify(APP_STATE.db)); 
            
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                const statusEl = document.getElementById('sync-status');
                if (statusEl) statusEl.innerHTML = `<i class="fas fa-spinner fa-spin text-amber-500"></i> Syncing...`;
                
                if (targetKey) {
                    google.script.run.withSuccessHandler(() => {
                        if (statusEl) statusEl.innerHTML = `<i class="fas fa-cloud-check text-emerald-600"></i> Spreadsheet Active`;
                    }).saveSheetData(targetKey, APP_STATE.db[targetKey]);
                } else {
                    Object.keys(APP_STATE.db).forEach(key => {
                        google.script.run.saveSheetData(key, APP_STATE.db[key]);
                    });
                    if (statusEl) statusEl.innerHTML = `<i class="fas fa-cloud-check text-emerald-600"></i> Spreadsheet Active`;
                }
            }
        }

        function fetchSpreadsheetData() {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler((sheetDB) => {
                    if (sheetDB && Object.keys(sheetDB).length > 0) {
                        APP_STATE.db = { ...APP_STATE.db, ...sheetDB };
                        localStorage.setItem('desa_keboledan_v3_1_db', JSON.stringify(APP_STATE.db));
                        if (APP_STATE.currentUser) navigate(APP_STATE.currentPage);
                    }
                }).getInitialData();
            }
        }

        function addLog(action) { 
            if (!APP_STATE.db.log) APP_STATE.db.log = [];
            APP_STATE.db.log.push({ user: APP_STATE.currentUser ? APP_STATE.currentUser.role : 'System', action, time: Date.now() }); 
            saveDB('log'); 
        }

        setInterval(() => {
            const dt = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const el = document.getElementById('datetime-display');
            if (el) el.innerText = dt.replace(/\./g, ':');
        }, 1000);

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value, p = document.getElementById('password').value;
            if (USERS[u] && USERS[u].pass === p) {
                APP_STATE.currentUser = { id: u, ...USERS[u] };
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('user-role-display').innerText = APP_STATE.currentUser.role;
                fetchSpreadsheetData();
                addLog('Login ke Sistem'); renderSidebar(); navigate('beranda');
                Swal.fire({ icon: 'success', title: 'Login Berhasil', text: `Selamat datang, ${APP_STATE.currentUser.name}`, showConfirmButton: false, timer: 1500 });
            } else Swal.fire({ icon: 'error', title: 'Akses Ditolak', text: 'Username atau Password salah!' });
        }

        function handleLogout() {
            Swal.fire({
                title: 'Keluar Sistem?', icon: 'question', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Ya, Keluar'
            }).then((result) => {
                if (result.isConfirmed) {
                    addLog('Logout dari Sistem'); APP_STATE.currentUser = null; 
                    document.getElementById('app-screen').classList.add('hidden'); 
                    document.getElementById('login-screen').classList.remove('hidden'); 
                    document.getElementById('login-form').reset();
                }
            });
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebar-menu'); nav.innerHTML = '';
            MENU_ITEMS.forEach(item => {
                const a = document.createElement('a'); a.href = '#';
                a.className = `flex items-center gap-3 px-6 py-3.5 text-sm font-medium transition-all duration-200 group ${APP_STATE.currentPage === item.id ? 'bg-gradient-to-r from-green-600/90 to-green-800 text-white border-l-4 border-green-400 shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white border-l-4 border-transparent'}`;
                a.onclick = (e) => { e.preventDefault(); navigate(item.id); };
                a.innerHTML = `<i class="fas ${item.icon} w-6 text-center text-lg group-hover:scale-110 transition-transform ${APP_STATE.currentPage === item.id ? 'text-green-300' : ''}"></i> <span class="tracking-wide">${item.title}</span>`;
                nav.appendChild(a);
            });
        }

        function navigate(pageId) {
            APP_STATE.currentPage = pageId; renderSidebar();
            const mTitle = MENU_ITEMS.find(m => m.id === pageId)?.title || 'Dashboard';
            document.getElementById('page-title').innerHTML = `<i class="fas ${MENU_ITEMS.find(m => m.id === pageId)?.icon} text-green-600 mr-2"></i> ${mTitle}`;
            
            const container = document.getElementById('main-content');
            container.innerHTML = '<div class="flex justify-center h-full items-center"><i class="fas fa-circle-notch fa-spin text-5xl text-green-500"></i></div>';
            
            setTimeout(() => { renderPageContent(pageId, container); }, 250);
        }

        function renderPageContent(pageId, container) {
            container.innerHTML = '';
            switch(pageId) {
                case 'beranda':
                    container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between relative overflow-hidden group hover:shadow-md transition">

        function showFormTambah(dbKey, fieldsStr) {
            const fields = fieldsStr.split(',');
            let html = `<form id="form-tambah-${dbKey}" class="space-y-4 grid grid-cols-1 md:grid-cols-2 gap-4">`;
            fields.forEach((f, i) => {
                let label = f.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                let type = 'text';
                if (f.includes('tanggal')) type = 'date';
                else if (f.startsWith('scan_')) type = 'url';
                
                let cls = i === 0 ? 'md:col-span-2 mt-4' : ''; 
                html += `<div class="${cls}">
                    <label class="block text-sm font-bold text-slate-700 mb-1.5">${label}</label>
                    <input type="${type}" id="input-${dbKey}-${f}" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition text-sm" placeholder="Masukkan ${label}">
                </div>`;
            });
            html += `</form>`;
            
            Swal.fire({
                title: 'Tambah Data Baru', html: html, showCancelButton: true, confirmButtonText: 'Simpan', confirmButtonColor: '#10b981', cancelButtonText: 'Batal',
                width: '800px',
                preConfirm: () => {
                    let newData = {}; fields.forEach(f => { newData[f] = document.getElementById(`input-${dbKey}-${f}`).value; });
                    return newData;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    if(!APP_STATE.db[dbKey]) APP_STATE.db[dbKey] = [];
                    APP_STATE.db[dbKey].push(result.value); saveDB(dbKey); addLog(`Menambah data pada ${dbKey}`); navigate(dbKey);
                    Swal.fire({icon:'success', title:'Tersimpan', showConfirmButton:false, timer:1000});
                }
            });
        }

        function editData(dbKey, index, fields) {
            let row = APP_STATE.db[dbKey][index];
            let html = `<form id="form-edit-${dbKey}" class="space-y-4 grid grid-cols-1 md:grid-cols-2 gap-4">`;
            fields.forEach((f, i) => {
                let label = f.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                let type = 'text';
                if (f.includes('tanggal')) type = 'date'; else if (f.startsWith('scan_')) type = 'url';
                let cls = i === 0 ? 'md:col-span-2 mt-4' : '';
                html += `<div class="${cls}">
                    <label class="block text-sm font-bold text-slate-700 mb-1.5">${label}</label>
                    <input type="${type}" id="edit-${dbKey}-${f}" value="${row[f]||''}" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-green-500 outline-none transition text-sm">
                </div>`;
            });
            html += `</form>`;
            
            Swal.fire({
                title: 'Edit Data', html: html, showCancelButton: true, confirmButtonText: 'Update', confirmButtonColor: '#3b82f6', width: '800px',
                preConfirm: () => { let newData = {}; fields.forEach(f => { newData[f] = document.getElementById(`edit-${dbKey}-${f}`).value; }); return newData; }
            }).then((result) => {
                if (result.isConfirmed) {
                    APP_STATE.db[dbKey][index] = result.value; saveDB(dbKey); addLog(`Mengubah data pada ${dbKey}`); navigate(dbKey);
                    Swal.fire({icon:'success', title:'Diperbarui', showConfirmButton:false, timer:1000});
                }
            });
        }

        function hapusData(dbKey, index) {
            Swal.fire({ title: 'Hapus Data?', text: "Data tidak bisa dikembalikan!", icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Ya, Hapus' })
            .then((result) => {
                if (result.isConfirmed) { APP_STATE.db[dbKey].splice(index, 1); saveDB(dbKey); addLog(`Menghapus data dari ${dbKey}`); navigate(dbKey); }
            });
        }

        function filterTable(dbKey) {
            const input = document.getElementById(`search-${dbKey}`).value.toLowerCase();
            const rows = document.querySelectorAll(`#table-${dbKey} tbody tr`);
            rows.forEach(row => {
                let text = row.innerText.toLowerCase();
                row.style.display = text.includes(input) ? '' : 'none';
            });
        }

        function handleCSVUpload(e, dbKey) {
            const file = e.target.files[0]; if(!file) return;
            Papa.parse(file, {
                header: true, skipEmptyLines: true,
                complete: function(results) {
                    if(results.data.length > 0) {
                        if(!APP_STATE.db[dbKey]) APP_STATE.db[dbKey] = [];
                        APP_STATE.db[dbKey] = [...APP_STATE.db[dbKey], ...results.data]; saveDB(dbKey); addLog(`Upload CSV ke ${dbKey}`); navigate(dbKey);
                        Swal.fire({icon:'success', title:`${results.data.length} Data Berhasil Diimpor`, showConfirmButton:false, timer:1500});
                    }
                }
            });
        }

        function exportDataExcel(dbKey) {
            const data = APP_STATE.db[dbKey] || []; if(data.length===0) return Swal.fire('Kosong','Tidak ada data','info');
            const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Data");
            XLSX.writeFile(wb, `${dbKey}_export_${new Date().getTime()}.xlsx`);
            addLog(`Export Excel: ${dbKey}`);
        }

        function exportDataWord(dbKey, title) {
            const tableHTML = document.getElementById(`table-${dbKey}`).outerHTML;
            const htmlContent = `<h2>Data ${title}</h2><br>${tableHTML}`;
            downloadAsWord(htmlContent, `${dbKey}_export`); addLog(`Export Word: ${dbKey}`);
        }

        function exportDataPDF(dbKey, title) {
            const data = APP_STATE.db[dbKey] || []; if(data.length===0) return Swal.fire('Kosong','Tidak ada data','info');
            
            // Build temporary HTML for PDF Table
            const container = document.getElementById('editor-pdf-content');
            let cols = Object.keys(data[0]);
            let html = `<div style="padding: 20px;"><h2 style="text-align:center; font-family: sans-serif;">DATA ${title.toUpperCase()}</h2><br>
                <table style="width:100%; border-collapse:collapse; font-family:sans-serif; font-size:10px;" border="1">
                <thead style="background-color:#f1f1f1;"><tr><th style="padding:5px;">No</th>${cols.map(c=>`<th style="padding:5px;">${c}</th>`).join('')}</tr></thead><tbody>`;
            data.forEach((row, i) => { html += `<tr><td style="padding:5px; text-align:center;">${i+1}</td>${cols.map(c=>`<td style="padding:5px;">${row[c]||'-'}</td>`).join('')}</tr>`; });
            html += `</tbody></table></div>`;
            container.innerHTML = html;
            
            html2pdf().set({
                margin: 0.5, filename: `${dbKey}_export.pdf`, image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
            }).from(container).save().then(()=>{ addLog(`Export PDF: ${dbKey}`); container.innerHTML=''; });
        }

        function printTable(dbKey, title) {
            const tableHTML = document.getElementById(`table-${dbKey}`).outerHTML;
            const printArea = document.getElementById('print-area');
            printArea.innerHTML = `<h2 class="text-center font-bold text-xl mb-6 mt-10 uppercase">DATA ${title}</h2>${tableHTML}`;
            // Clean up action column for printing

            actionCells.forEach(cell => cell.remove());
            
            document.getElementById('print-preview-modal').classList.remove('hidden');
        }

        function cariPenduduk() {
            const input = document.getElementById('cari_pemohon').value.toLowerCase();
            const p = APP_STATE.db.penduduk.find(x => x.nik.toLowerCase() === input || x.nama.toLowerCase().includes(input));
            if(p) {
                if(document.getElementById('fs_nama_lengkap')) document.getElementById('fs_nama_lengkap').value = p.nama || '';
                if(document.getElementById('fs_nik')) document.getElementById('fs_nik').value = p.nik || '';
                if(document.getElementById('fs_tempat_lahir')) document.getElementById('fs_tempat_lahir').value = p.tempat_lahir || '';
                if(document.getElementById('fs_tanggal_lahir')) document.getElementById('fs_tanggal_lahir').value = p.tanggal_lahir || '';
                if(document.getElementById('fs_jenis_kelamin')) document.getElementById('fs_jenis_kelamin').value = p.jk || '';
                if(document.getElementById('fs_agama')) document.getElementById('fs_agama').value = p.agama || '';
                if(document.getElementById('fs_pekerjaan')) document.getElementById('fs_pekerjaan').value = p.pekerjaan || '';
                if(document.getElementById('fs_alamat')) document.getElementById('fs_alamat').value = `${p.alamat}, RT ${p.rt}/RW ${p.rw}`;

        // --- Fitur Ruang Kerja (Quill Editor) ---
        function renderWorkspaceArea(container, pageId) {
            const title = MENU_ITEMS.find(m => m.id === pageId).title;
            const dbKey = 'docs_' + pageId;
            if(!APP_STATE.db[dbKey]) APP_STATE.db[dbKey] = [];
            
            let html = `
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-full overflow-hidden">
                <div class="p-6 border-b border-slate-200 flex justify-between items-center bg-slate-50/80">
                    <h3 class="text-xl font-extrabold text-slate-800 flex items-center"><div class="w-8 h-8 bg-purple-100 text-purple-600 rounded-lg flex items-center justify-center mr-3 shadow-inner"><i class="fas fa-edit"></i></div> ${title}</h3>
                    <button onclick="bukaEditor('${dbKey}')" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition shadow-md shadow-purple-500/20 flex items-center"><i class="fas fa-plus mr-2"></i> Buat Dokumen Baru</button>
                </div>
                
                <div class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 overflow-y-auto" id="workspace-grid-${dbKey}">`;
                
            if(APP_STATE.db[dbKey].length === 0) {
                html += `<div class="col-span-full py-16 flex flex-col items-center justify-center text-slate-400 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200">
                    <i class="fas fa-folder-open text-5xl mb-4 text-slate-300"></i>
                    <p class="font-semibold text-lg">Belum ada dokumen di ruang ini</p>
                    <p class="text-sm mt-1">Klik tombol di atas untuk membuat dokumen baru</p>
                </div>`;
            } else {
                APP_STATE.db[dbKey].forEach((doc, i) => {
                    html += `
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col group overflow-hidden">
                        <div class="p-5 flex-1 border-b border-slate-100">
                            <div class="flex justify-between items-start mb-3">
                                <div class="bg-purple-100 text-purple-600 p-2 rounded-lg"><i class="fas fa-file-alt text-xl"></i></div>
                                <span class="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-1 rounded-md border border-slate-200">${doc.tanggal}</span>
                            </div>
                            <h4 class="font-bold text-slate-800 text-lg mb-1 group-hover:text-purple-600 transition truncate">${doc.judul}</h4>
                            <p class="text-xs text-slate-500 line-clamp-2">${doc.content.replace(/<[^>]*>?/gm, ' ')}</p>
                        </div>
                        <div class="bg-slate-50 p-3 flex justify-between items-center gap-2">
                            <button onclick="bukaEditor('${dbKey}', ${i})" class="flex-1 bg-white hover:bg-purple-50 text-purple-600 border border-purple-200 px-3 py-1.5 rounded-lg text-xs font-bold transition flex justify-center items-center"><i class="fas fa-edit mr-1"></i> Edit</button>
                            <button onclick="printDokumenKerja('${dbKey}', ${i})" class="flex-1 bg-white hover:bg-emerald-50 text-emerald-600 border border-emerald-200 px-3 py-1.5 rounded-lg text-xs font-bold transition flex justify-center items-center"><i class="fas fa-print mr-1"></i> Print</button>
                            <button onclick="hapusDokumenKerja('${dbKey}', ${i})" class="bg-white hover:bg-red-50 text-red-500 border border-red-200 p-1.5 rounded-lg transition" title="Hapus"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>`;
                });
            }
            html += `</div></div>`;
            container.innerHTML = html;
        }

        function bukaEditor(dbKey, index = -1) {
            currentWorkspaceEditIndex = index;
            let doc = index >= 0 ? APP_STATE.db[dbKey][index] : { judul: '', content: '' };
            
            let html = `
            <div class="mb-4">
                <input type="text" id="editor-judul" value="${doc.judul}" placeholder="Judul Dokumen (Misal: Proposal Pembangunan Desa...)" class="w-full px-4 py-3 text-lg font-bold bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none transition">
            </div>
            <div id="quill-editor" style="height: 400px; background:white;">${doc.content}</div>
            `;
            
            Swal.fire({
                title: index >= 0 ? 'Edit Dokumen' : 'Dokumen Baru',
                html: html, width: '900px', showCancelButton: true, confirmButtonText: 'Simpan Dokumen', confirmButtonColor: '#9333ea', cancelButtonText: 'Batal',
                didOpen: () => {
                    quillEditor = new Quill('#quill-editor', {
                        theme: 'snow',
                        modules: { toolbar: [ [{ 'header': [1, 2, 3, false] }], ['bold', 'italic', 'underline', 'strike'], [{ 'list': 'ordered'}, { 'list': 'bullet' }], [{ 'align': [] }], ['link', 'image'], ['clean'] ] }
                    });
                },
                preConfirm: () => {
                    const judul = document.getElementById('editor-judul').value;
                    const content = quillEditor.root.innerHTML;
                    if(!judul.trim()) { Swal.showValidationMessage('Judul tidak boleh kosong!'); return false; }
                    return { judul, content, tanggal: new Date().toLocaleDateString('id-ID') };
                }
            }).then((result) => {
                if(result.isConfirmed) {
                    if(index >= 0) APP_STATE.db[dbKey][index] = result.value;
                    else APP_STATE.db[dbKey].push(result.value);
                    saveDB(dbKey); addLog(`Menyimpan dokumen ${result.value.judul}`); navigate(pageIdFromDbKey(dbKey));
                    Swal.fire({icon:'success', title:'Tersimpan', showConfirmButton:false, timer:1000});
                }
            });
        }

        function hapusDokumenKerja(dbKey, index) {
            Swal.fire({ title: 'Hapus Dokumen?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Hapus' })
            .then((res) => { if(res.isConfirmed) { APP_STATE.db[dbKey].splice(index, 1); saveDB(dbKey); navigate(pageIdFromDbKey(dbKey)); } });
        }

        function printDokumenKerja(dbKey, index) {
            const doc = APP_STATE.db[dbKey][index];
            const printArea = document.getElementById('print-area');
            printArea.innerHTML = `
                <div style="margin-bottom: 20px; text-align:center;">
                    <h2 style="font-size: 18pt; font-weight: bold; text-transform: uppercase;">${doc.judul}</h2>
                    <hr style="border-top: 2px solid black; margin-top: 10px;">
                </div>
                <div class="quill-content-print" style="font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.5;">${doc.content}</div>
            `;
            document.getElementById('print-preview-modal').classList.remove('hidden');
        }

        function pageIdFromDbKey(dbKey) { return dbKey.replace('docs_', ''); }

        // --- INIT ---
        window.onload = () => { if(APP_STATE.currentUser) { document.getElementById('login-screen').classList.add('hidden'); document.getElementById('app-screen').classList.remove('hidden'); document.getElementById('user-role-display').innerText = APP_STATE.currentUser.role; renderSidebar(); navigate('beranda'); fetchSpreadsheetData(); } };
    </script>
